<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Taka</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f1f5f9;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  text-align: center;
  padding: 22px;
}

header h1 {
  margin: 0;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 18px;
}

.demo {
  background: #fff3cd;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  margin-bottom: 15px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.balance {
  text-align: center;
}

.balance h2 {
  color: #64748b;
  font-size: 18px;
}

#balance {
  font-size: 38px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 16px;
  margin: 8px 0;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}

.deposit {
  background: #22c55e;
  color: white;
}

.withdraw {
  background: #ef4444;
  color: white;
}

.play {
  background: #2563eb;
  color: white;
}

#result {
  text-align: center;
  font-weight: bold;
  margin-top: 15px;
  min-height: 25px;
}

li {
  padding: 10px 0;
  border-bottom: 1px solid #e5e7eb;
}

.win {
  color: #16a34a;
}

.loss {
  color: #dc2626;
}

footer {
  text-align: center;
  color: #64748b;
  padding: 20px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>💰 Online Taka</h1>
  <p>Virtual Money Game</p>
</header>

<div class="container">

  <div class="demo">
    ⚠️ DEMO — All Taka in this game is virtual. No real money is used.
  </div>

  <div class="card balance">
    <h2>Your Balance</h2>
    <div id="balance">1000 Taka</div>
  </div>

  <div class="card">
    <h2>💰 Virtual Wallet</h2>

    <button class="deposit" onclick="deposit()">
      ➕ Deposit 100 Taka
    </button>

    <button class="withdraw" onclick="withdraw()">
      ➖ Withdraw 100 Taka
    </button>
  </div>

  <div class="card">
    <h2>🎮 Lucky Taka</h2>

    <p>Choose how much virtual Taka you want to bet.</p>

    <input
      type="number"
      id="bet"
      placeholder="Enter bet amount"
      min="10"
    >

    <button class="play" onclick="playGame()">
      🎲 Play
    </button>

    <div id="result"></div>
  </div>

  <div class="card">
    <h2>📜 Transactions</h2>

    <ul id="transactions">
      <li class="win">+1000 Taka — Starting balance</li>
    </ul>
  </div>

</div>

<footer>
  Online Taka © 2026 — Virtual Demo
</footer>

<script>

let balance = 1000;

function updateBalance() {
  document.getElementById("balance").textContent =
    balance + " Taka";
}

function addTransaction(text, type) {

  const list = document.getElementById("transactions");

  const item = document.createElement("li");

  item.textContent = text;

  item.className = type;

  list.insertBefore(item, list.firstChild);
}

function deposit() {

  balance += 100;

  updateBalance();

  addTransaction(
    "+100 Taka — Virtual deposit",
    "win"
  );
}

function withdraw() {

  if (balance < 100) {

    alert("Not enough virtual Taka!");

    return;
  }

  balance -= 100;

  updateBalance();

  addTransaction(
    "-100 Taka — Virtual withdrawal",
    "loss"
  );
}

function playGame() {

  const betInput =
    document.getElementById("bet");

  const bet =
    Number(betInput.value);

  const result =
    document.getElementById("result");

  if (!bet || bet < 10) {

    result.textContent =
      "❌ Minimum bet is 10 virtual Taka.";

    return;
  }

  if (bet > balance) {

    result.textContent =
      "❌ You don't have enough virtual Taka.";

    return;
  }

  balance -= bet;

  const win =
    Math.random() < 0.5;

  if (win) {

    const winnings = bet * 2;

    balance += winnings;

    result.textContent =
      "🎉 You won " +
      winnings +
      " virtual Taka!";

    addTransaction(
      "+" + winnings +
      " Taka — Game win",
      "win"
    );

  } else {

    result.textContent =
      "😢 You lost " +
      bet +
      " virtual Taka.";

    addTransaction(
      "-" + bet +
      " Taka — Game loss",
      "loss"
    );
  }

  updateBalance();

  betInput.value = "";
}

updateBalance();

</script>

</body>
</html>
