<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Security Training Simulation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: white;
      width: 350px;
      padding: 30px;
      border: 1px solid #ddd;
      border-radius: 12px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4285f4;
      color: white;
      border: 0;
      border-radius: 5px;
      margin-top: 10px;
    }
    #result {
      display: none;
      margin-top: 20px;
      color: #188038;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Security Training</h2>
  <p>Training login simulation</p>

  <input type="email" placeholder="Email">
  <input type="password" placeholder="Password">

  <button type="button" onclick="trainingComplete()">Sign in</button>

  <div id="result">
    <b>Training simulation complete.</b><br>
    No credentials were collected or saved.
  </div>
</div>

<script>
function trainingComplete() {
  document.getElementById("result").style.display = "block";
}
</script>

</body>
</html>
